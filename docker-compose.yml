version: "3.8"

services:
  ocr-app:
    build: .
    container_name: ocr-app
    ports:
      - "5000:5000"
    restart: always
    volumes:
      # Persist HuggingFace model cache across container restarts
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  hf-cache:

